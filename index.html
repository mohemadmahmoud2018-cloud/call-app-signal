<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#111827"
  >

  <title>CALL APP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 900px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }

    header p {
      margin: 0;
      color: #9ca3af;
    }

    .status {
      margin: 20px 0;
      padding: 12px;
      border-radius: 10px;
      background: #1f2937;
      text-align: center;
      color: #d1d5db;
    }

    .videos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .video-box {
      position: relative;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 16 / 10;
      border: 1px solid #374151;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .label {
      position: absolute;
      left: 12px;
      bottom: 12px;
      background: rgba(0, 0, 0, 0.65);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.danger {
      background: #dc2626;
    }

    button.secondary {
      background: #374151;
    }

    .room {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .room input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #374151;
      background: #1f2937;
      color: white;
      font-size: 15px;
      outline: none;
    }

    .room input:focus {
      border-color: #2563eb;
    }

    @media (max-width: 700px) {
      .videos {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header>
      <h1>📞 CALL APP</h1>
      <p>Secure video calling</p>
    </header>

    <div id="status" class="status">
      Ready
    </div>

    <div class="videos">

      <div class="video-box">
        <video
          id="localVideo"
          autoplay
          muted
          playsinline
        ></video>

        <div class="label">
          You
        </div>
      </div>

      <div class="video-box">
        <video
          id="remoteVideo"
          autoplay
          playsinline
        ></video>

        <div class="label">
          Other person
        </div>
      </div>

    </div>

    <div class="room">

      <input
        id="roomInput"
        type="text"
        value="family"
        maxlength="50"
        placeholder="Room name"
      >

      <button id="joinBtn">
        Join
      </button>

    </div>

    <div class="controls">

      <button
        id="cameraBtn"
        class="secondary"
      >
        Camera
      </button>

      <button
        id="micBtn"
        class="secondary"
      >
        Microphone
      </button>

      <button
        id="leaveBtn"
        class="danger"
      >
        Leave
      </button>

    </div>

  </main>

  <script>
    const localVideo =
      document.getElementById("localVideo");

    const remoteVideo =
      document.getElementById("remoteVideo");

    const statusEl =
      document.getElementById("status");

    const roomInput =
      document.getElementById("roomInput");

    const joinBtn =
      document.getElementById("joinBtn");

    const cameraBtn =
      document.getElementById("cameraBtn");

    const micBtn =
      document.getElementById("micBtn");

    const leaveBtn =
      document.getElementById("leaveBtn");


    let localStream = null;

    let peerConnection = null;

    let socket = null;

    let clientId = null;

    let remoteClientId = null;

    let pendingCandidates = [];

    let isJoined = false;

    let isMakingOffer = false;


    const rtcConfig = {

      iceServers: [

        {
          urls: "stun:stun.l.google.com:19302"
        },

        {
          urls: "stun:stun1.l.google.com:19302"
        },

        {
          urls: "stun:stun2.l.google.com:19302"
        }

      ]

    };


    function setStatus(message) {

      statusEl.textContent = message;

      console.log(
        "[CALL APP]",
        message
      );

    }


    function getWebSocketUrl(room) {

      const protocol =
        location.protocol === "https:"
          ? "wss:"
          : "ws:";

      return (
        `${protocol}//${location.host}/ws` +
        `?room=${encodeURIComponent(room)}`
      );

    }


    async function startMedia() {

      if (localStream) {

        return localStream;

      }


      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        setStatus(
          "Camera and microphone are not supported"
        );

        throw new Error(
          "getUserMedia is not supported"
        );

      }


      try {

        localStream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: "user"
            },

            audio: true

          });


        localVideo.srcObject =
          localStream;


        await localVideo.play().catch(() => {});


        setStatus(
          "Camera and microphone ready"
        );


        return localStream;


      } catch (error) {

        console.error(
          "Media error:",
          error
        );


        setStatus(
          "Camera/microphone permission is required"
        );


        throw error;

      }

    }


    function createPeerConnection() {

      if (peerConnection) {

        try {
          peerConnection.close();
        } catch {}

      }


      peerConnection =
        new RTCPeerConnection(
          rtcConfig
        );


      if (localStream) {

        for (
          const track
          of localStream.getTracks()
        ) {

          peerConnection.addTrack(
            track,
            localStream
          );

        }

      }


      peerConnection.ontrack =
        async (event) => {

          console.log(
            "[WEBRTC] Remote track received"
          );


          if (
            event.streams &&
            event.streams[0]
          ) {

            remoteVideo.srcObject =
              event.streams[0];

            await remoteVideo
              .play()
              .catch(() => {});

          }

        };


      peerConnection.onicecandidate =
        (event) => {

          if (!event.candidate) {

            return;

          }


          sendSignal({

            type: "ice",

            candidate: event.candidate

          });

        };


      peerConnection.onconnectionstatechange =
        () => {

          if (!peerConnection) {

            return;

          }


          const state =
            peerConnection.connectionState;


          console.log(
            "[WEBRTC] Connection state:",
            state
          );


          if (state === "connected") {

            setStatus(
              "Connected"
            );

          }

          else if (state === "connecting") {

            setStatus(
              "Connecting..."
            );

          }

          else if (state === "disconnected") {

            setStatus(
              "Connection interrupted"
            );

          }

          else if (state === "failed") {

            setStatus(
              "Connection failed"
            );

          }

          else if (state === "closed") {

            setStatus(
              "Call ended"
            );

          }

        };


      peerConnection.oniceconnectionstatechange =
        () => {

          if (!peerConnection) {

            return;

          }


          console.log(
            "[WEBRTC] ICE:",
            peerConnection.iceConnectionState
          );

        };


      return peerConnection;

    }


    function sendSignal(data) {

      if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
      ) {

        console.warn(
          "[SIGNAL] WebSocket is not open"
        );

        return;

      }


      if (!remoteClientId) {

        console.warn(
          "[SIGNAL] No remote client"
        );

        return;

      }


      socket.send(

        JSON.stringify({

          type: "signal",

          target: remoteClientId,

          data: data

        })

      );

    }


    async function makeOffer() {

      if (!remoteClientId) {

        return;

      }


      if (isMakingOffer) {

        return;

      }


      isMakingOffer = true;


      try {

        const pc =
          peerConnection ||
          createPeerConnection();


        const offer =
          await pc.createOffer();


        await pc.setLocalDescription(
          offer
        );


        sendSignal({

          type: "offer",

          offer: pc.localDescription

        });


        setStatus(
          "Calling..."
        );


      } catch (error) {

        console.error(
          "Offer error:",
          error
        );

      } finally {

        isMakingOffer = false;

      }

    }


    async function handleSignal(
      message
    ) {

      const data =
        message.data;


      if (!data) {

        return;

      }


      if (!peerConnection) {

        createPeerConnection();

      }


      const pc =
        peerConnection;


      try {

        if (data.type === "offer") {

          remoteClientId =
            message.from;


          await pc.setRemoteDescription(

            new RTCSessionDescription(
              data.offer
            )

          );


          for (
            const candidate
            of pendingCandidates
          ) {

            await pc.addIceCandidate(
              candidate
            );

          }


          pendingCandidates = [];


          const answer =
            await pc.createAnswer();


          await pc.setLocalDescription(
            answer
          );


          sendSignal({

            type: "answer",

            answer: pc.localDescription

          });


          setStatus(
            "Answer sent"
          );


          return;

        }


        if (data.type === "answer") {

          await pc.setRemoteDescription(

            new RTCSessionDescription(
              data.answer
            )

          );


          for (
            const candidate
            of pendingCandidates
          ) {

            await pc.addIceCandidate(
              candidate
            );

          }


          pendingCandidates = [];


          setStatus(
            "Connecting..."
          );


          return;

        }


        if (data.type === "ice") {

          const candidate =
            new RTCIceCandidate(
              data.candidate
            );


          if (
            pc.remoteDescription &&
            pc.remoteDescription.type
          ) {

            await pc.addIceCandidate(
              candidate
            );

          } else {

            pendingCandidates.push(
              candidate
            );

          }


          return;

        }

      } catch (error) {

        console.error(
          "Signal handling error:",
          error
        );

        setStatus(
          "WebRTC signaling error"
        );

      }

    }


    async function connectSocket() {

      if (
        socket &&
        socket.readyState === WebSocket.OPEN
      ) {

        setStatus(
          "Already connected"
        );

        return;

      }


      const room =
        roomInput.value.trim() ||
        "family";


      if (
        !/^[a-zA-Z0-9_-]{1,50}$/.test(
          room
        )
      ) {

        setStatus(
          "Invalid room name"
        );

        return;

      }


      await startMedia();


      const wsUrl =
        getWebSocketUrl(room);


      console.log(
        "[SIGNAL] Connecting to:",
        wsUrl
      );


      setStatus(
        "Connecting to signal server..."
      );


      socket =
        new WebSocket(wsUrl);


      socket.onopen =
        () => {

          console.log(
            "[SIGNAL] WebSocket connected"
          );


          setStatus(
            "Connected to signal server"
          );


          socket.send(

            JSON.stringify({

              type: "join"

            })

          );

        };


      socket.onmessage =
        async (event) => {

          try {

            const message =
              JSON.parse(
                event.data
              );


            console.log(
              "[SIGNAL]",
              message
            );


            if (
              message.type ===
              "connected"
            ) {

              clientId =
                message.clientId;


              return;

            }


            if (
              message.type ===
              "room_joined"
            ) {

              isJoined = true;


              setStatus(

                message.users > 0

                  ? "Other person found"

                  : "Waiting for other person..."

              );


              if (
                message.users > 0
              ) {

                const users =
                  message.users;


                if (!remoteClientId) {

                  console.log(
                    "[SIGNAL] Waiting for peer_joined..."
                  );

                }

              }


              return;

            }


            if (
              message.type ===
              "peer_joined"
            ) {

              remoteClientId =
                message.clientId;


              console.log(
                "[SIGNAL] Peer joined:",
                remoteClientId
              );


              setStatus(
                "Other person joined"
              );


              if (!peerConnection) {

                createPeerConnection();

              }


              await makeOffer();


              return;

            }


            if (
              message.type ===
              "signal"
            ) {

              remoteClientId =
                message.from;


              await handleSignal(
                message
              );


              return;

            }


            if (
              message.type ===
              "peer_left"
            ) {

              remoteClientId = null;


              remoteVideo.srcObject =
                null;


              pendingCandidates = [];


              if (peerConnection) {

                try {
                  peerConnection.close();
                } catch {}

                peerConnection = null;

              }


              setStatus(
                "The other person left"
              );


              return;

            }


            if (
              message.type ===
              "error"
            ) {

              setStatus(
                message.message
              );

            }

          } catch (error) {

            console.error(
              "Message handling error:",
              error
            );

          }

        };


      socket.onerror =
        (error) => {

          console.error(
            "[SIGNAL] WebSocket error:",
            error
          );


          setStatus(
            "WebSocket connection error"
          );

        };


      socket.onclose =
        (event) => {

          console.log(
            "[SIGNAL] WebSocket closed:",
            event.code,
            event.reason
          );


          isJoined = false;

          remoteClientId = null;


          setStatus(
            "Disconnected from signal server"
          );

        };

    }


    function leaveCall() {

      if (socket) {

        try {

          socket.send(

            JSON.stringify({

              type: "leave"

            })

          );

        } catch {}

        try {

          socket.close();

        } catch {}

      }


      socket = null;


      if (peerConnection) {

        try {

          peerConnection.close();

        } catch {}

        peerConnection = null;

      }


      remoteVideo.srcObject =
        null;


      remoteClientId = null;

      pendingCandidates = [];

      isJoined = false;


      setStatus(
        "Left the call"
      );

    }


    cameraBtn.addEventListener(
      "click",
      async () => {

        if (!localStream) {

          try {

            await startMedia();

          } catch {

            return;

          }

        }


        const track =
          localStream.getVideoTracks()[0];


        if (!track) {

          return;

        }


        track.enabled =
          !track.enabled;


        cameraBtn.textContent =
          track.enabled
            ? "Camera"
            : "Camera Off";

      }
    );


    micBtn.addEventListener(
      "click",
      async () => {

        if (!localStream) {

          try {

            await startMedia();

          } catch {

            return;

          }

        }


        const track =
          localStream.getAudioTracks()[0];


        if (!track) {

          return;

        }


        track.enabled =
          !track.enabled;


        micBtn.textContent =
          track.enabled
            ? "Microphone"
            : "Microphone Off";

      }
    );


    joinBtn.addEventListener(
      "click",
      async () => {

        joinBtn.disabled = true;


        try {

          await connectSocket();

        } catch (error) {

          console.error(
            "Join error:",
            error
          );

          setStatus(
            "Unable to join the call"
          );

          joinBtn.disabled = false;

        }

      }
    );


    leaveBtn.addEventListener(
      "click",
      () => {

        leaveCall();

        joinBtn.disabled = false;

      }
    );


    window.addEventListener(
      "beforeunload",
      () => {

        try {

          socket?.close();

        } catch {}

      }
    );

  </script>

</body>
</html>
