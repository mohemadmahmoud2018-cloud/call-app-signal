```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CALL APP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 900px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }

    header p {
      margin: 0;
      color: #9ca3af;
    }

    .status {
      margin: 20px 0;
      padding: 12px;
      border-radius: 10px;
      background: #1f2937;
      text-align: center;
      color: #d1d5db;
    }

    .videos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .video-box {
      position: relative;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 16 / 10;
      border: 1px solid #374151;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .label {
      position: absolute;
      left: 12px;
      bottom: 12px;
      background: rgba(0, 0, 0, 0.65);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    button.danger {
      background: #dc2626;
    }

    button.secondary {
      background: #374151;
    }

    .room {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .room input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #374151;
      background: #1f2937;
      color: white;
      font-size: 15px;
      outline: none;
    }

    .room input:focus {
      border-color: #2563eb;
    }

    @media (max-width: 700px) {
      .videos {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header>
      <h1>📞 CALL APP</h1>
      <p>Secure video calling</p>
    </header>

    <div id="status" class="status">
      Ready
    </div>

    <div class="videos">

      <div class="video-box">

        <video
          id="localVideo"
          autoplay
          muted
          playsinline
        ></video>

        <div class="label">
          You
        </div>

      </div>

      <div class="video-box">

        <video
          id="remoteVideo"
          autoplay
          playsinline
        ></video>

        <div class="label">
          Other person
        </div>

      </div>

    </div>

    <div class="room">

      <input
        id="roomInput"
        type="text"
        value="family"
        maxlength="50"
        placeholder="Room name"
      >

      <button id="joinBtn">
        Join
      </button>

    </div>

    <div class="controls">

      <button
        id="cameraBtn"
        class="secondary"
      >
        Camera
      </button>

      <button
        id="micBtn"
        class="secondary"
      >
        Microphone
      </button>

      <button
        id="leaveBtn"
        class="danger"
      >
        Leave
      </button>

    </div>

  </main>

  <script>

    const localVideo =
      document.getElementById("localVideo");

    const remoteVideo =
      document.getElementById("remoteVideo");

    const statusEl =
      document.getElementById("status");

    const roomInput =
      document.getElementById("roomInput");

    const joinBtn =
      document.getElementById("joinBtn");

    const cameraBtn =
      document.getElementById("cameraBtn");

    const micBtn =
      document.getElementById("micBtn");

    const leaveBtn =
      document.getElementById("leaveBtn");


    let localStream = null;

    let peerConnection = null;

    let socket = null;

    let clientId = null;

    let remoteClientId = null;

    let pendingCandidates = [];


    // Default STUN configuration.
    // TURN configuration will be loaded from Render.
    let rtcConfig = {

      iceServers: [

        {
          urls: "stun:stun.l.google.com:19302"
        },

        {
          urls: "stun:stun1.l.google.com:19302"
        },

        {
          urls: "stun:stun2.l.google.com:19302"
        }

      ]

    };


    let turnConfigLoaded = false;


    function setStatus(message) {

      statusEl.textContent = message;

      console.log(
        "[CALL APP]",
        message
      );

    }


    function getWebSocketUrl(room) {

      const protocol =
        location.protocol === "https:"
          ? "wss:"
          : "ws:";

      return (
        `${protocol}//${location.host}/ws?room=` +
        encodeURIComponent(room)
      );

    }


    // Load TURN configuration from Render.
    async function loadTurnConfig() {

      if (turnConfigLoaded) {
        return;
      }

      try {

        console.log(
          "[WEBRTC] Loading TURN configuration..."
        );

        const response =
          await fetch(
            "/turn-config",
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            `TURN config HTTP ${response.status}`
          );

        }


        const config =
          await response.json();


        if (
          config &&
          Array.isArray(config.iceServers)
        ) {

          // Keep Google STUN and add Metered TURN.
          rtcConfig = {

            iceServers: [

              ...rtcConfig.iceServers,

              ...config.iceServers

            ]

          };


          turnConfigLoaded = true;


          console.log(
            "[WEBRTC] TURN configuration loaded"
          );


          console.log(
            "[WEBRTC] ICE servers:",
            rtcConfig.iceServers
          );

        } else {

          throw new Error(
            "Invalid TURN configuration"
          );

        }

      } catch (error) {

        console.warn(
          "[WEBRTC] TURN configuration unavailable. Using STUN only.",
          error
        );

      }

    }


    async function startMedia() {

      if (localStream) {
        return localStream;
      }


      try {

        localStream =
          await navigator.mediaDevices.getUserMedia({

            video: true,

            audio: true

          });


        localVideo.srcObject =
          localStream;


        setStatus(
          "Camera and microphone ready"
        );


        return localStream;


      } catch (error) {

        console.error(
          "[MEDIA]",
          error
        );


        setStatus(
          "Camera/microphone permission is required"
        );


        throw error;

      }

    }


    function createPeerConnection() {

      if (peerConnection) {

        peerConnection.close();

      }


      console.log(
        "[WEBRTC] Creating peer connection"
      );


      peerConnection =
        new RTCPeerConnection(
          rtcConfig
        );


      if (localStream) {

        for (
          const track of localStream.getTracks()
        ) {

          peerConnection.addTrack(
            track,
            localStream
          );

        }

      }


      peerConnection.ontrack =
        (event) => {

          console.log(
            "[WEBRTC] Remote track received"
          );


          if (
            event.streams &&
            event.streams[0]
          ) {

            remoteVideo.srcObject =
              event.streams[0];

          }

        };


      peerConnection.onicecandidate =
        (event) => {

          if (!event.candidate) {

            console.log(
              "[WEBRTC] ICE gathering complete"
            );

            return;

          }


          console.log(
            "[WEBRTC] ICE candidate:",
            event.candidate.candidate
          );


          sendSignal({

            type: "ice",

            candidate:
              event.candidate

          });

        };


      peerConnection.onicecandidateerror =
        (event) => {

          console.warn(
            "[WEBRTC] ICE candidate error:",
            event
          );

        };


      peerConnection.oniceconnectionstatechange =
        () => {

          const state =
            peerConnection.iceConnectionState;


          console.log(
            "[WEBRTC] ICE state:",
            state
          );

        };


      peerConnection.onconnectionstatechange =
        () => {

          const state =
            peerConnection.connectionState;


          console.log(
            "[WEBRTC] Connection state:",
            state
          );


          setStatus(
            `Connection: ${state}`
          );


          if (state === "connected") {

            setStatus(
              "Connected successfully"
            );

          }


          if (state === "failed") {

            setStatus(
              "Connection failed"
            );

          }

        };


      return peerConnection;

    }


    function sendSignal(data) {

      if (
        !socket ||
        socket.readyState !==
          WebSocket.OPEN
      ) {

        return;

      }


      socket.send(

        JSON.stringify({

          type: "signal",

          target:
            remoteClientId,

          data

        })

      );

    }


    async function makeOffer() {

      if (!remoteClientId) {

        console.warn(
          "[WEBRTC] No remote client ID yet"
        );

        return;

      }


      const pc =
        peerConnection ||
        createPeerConnection();


      const offer =
        await pc.createOffer();


      await pc.setLocalDescription(
        offer
      );


      sendSignal({

        type: "offer",

        offer

      });


      console.log(
        "[WEBRTC] Offer sent"
      );

    }


    async function handleSignal(data) {

      if (!peerConnection) {

        createPeerConnection();

      }


      const pc =
        peerConnection;


      if (data.type === "offer") {

        remoteClientId =
          data.from ||
          remoteClientId;


        await pc.setRemoteDescription(

          new RTCSessionDescription(
            data.offer
          )

        );


        for (
          const candidate of
          pendingCandidates
        ) {

          await pc.addIceCandidate(
            candidate
          );

        }


        pendingCandidates = [];


        const answer =
          await pc.createAnswer();


        await pc.setLocalDescription(
          answer
        );


        sendSignal({

          type: "answer",

          answer

        });


        console.log(
          "[WEBRTC] Answer sent"
        );


        return;

      }


      if (data.type === "answer") {

        await pc.setRemoteDescription(

          new RTCSessionDescription(
            data.answer
          )

        );


        for (
          const candidate of
          pendingCandidates
        ) {

          await pc.addIceCandidate(
            candidate
          );

        }


        pendingCandidates = [];


        console.log(
          "[WEBRTC] Answer received"
        );


        return;

      }


      if (data.type === "ice") {

        const candidate =
          new RTCIceCandidate(
            data.candidate
          );


        if (
          pc.remoteDescription &&
          pc.remoteDescription.type
        ) {

          await pc.addIceCandidate(
            candidate
          );

        } else {

          pendingCandidates.push(
            candidate
          );

        }

      }

    }


    async function connectSocket() {

      if (
        socket &&
        socket.readyState ===
          WebSocket.OPEN
      ) {

        setStatus(
          "Already connected"
        );

        return;

      }


      const room =
        roomInput.value.trim() ||
        "family";


      if (
        !/^[a-zA-Z0-9_-]{1,50}$/.test(
          room
        )
      ) {

        setStatus(
          "Invalid room name"
        );

        return;

      }


      try {

        // Start camera and microphone.
        await startMedia();


        // Load Metered TURN configuration.
        await loadTurnConfig();


        const wsUrl =
          getWebSocketUrl(room);


        console.log(
          "[SIGNAL] Connecting to:",
          wsUrl
        );


        setStatus(
          "Connecting to signal server..."
        );


        socket =
          new WebSocket(wsUrl);


        socket.onopen =
          () => {

            console.log(
              "[SIGNAL] WebSocket connected"
            );


            setStatus(
              "Connected to signal server"
            );


            socket.send(

              JSON.stringify({

                type: "join"

              })

            );

          };


        socket.onmessage =
          async (event) => {

            try {

              const message =
                JSON.parse(
                  event.data
                );


              console.log(
                "[SIGNAL]",
                message
              );


              if (
                message.type ===
                "connected"
              ) {

                clientId =
                  message.clientId;


                return;

              }


              if (
                message.type ===
                "room_joined"
              ) {

                setStatus(

                  `Joined room • ${message.users} other user(s)`

                );


                if (
                  message.users > 0
                ) {

                  if (
                    !peerConnection
                  ) {

                    createPeerConnection();

                  }


                  /*
                   * The server sends peer_joined
                   * to the existing participant.
                   * We wait for the signal message
                   * to establish the remote client ID.
                   */

                }


                return;

              }


              if (
                message.type ===
                "peer_joined"
              ) {

                remoteClientId =
                  message.clientId;


                setStatus(
                  "Another person joined"
                );


                if (
                  !peerConnection
                ) {

                  createPeerConnection();

                }


                await makeOffer();


                return;

              }


              if (
                message.type ===
                "signal"
              ) {

                remoteClientId =
                  message.from;


                await handleSignal({

                  ...message.data,

                  from:
                    message.from

                });


                return;

              }


              if (
                message.type ===
                "peer_left"
              ) {

                remoteClientId =
                  null;


                remoteVideo.srcObject =
                  null;


                if (peerConnection) {

                  peerConnection.close();

                  peerConnection =
                    null;

                }


                pendingCandidates = [];


                setStatus(
                  "The other person left"
                );


                return;

              }


              if (
                message.type ===
                "error"
              ) {

                setStatus(
                  message.message
                );

              }

            } catch (error) {

              console.error(
                "[SIGNAL] Message handling error:",
                error
              );

            }

          };


        socket.onerror =
          (error) => {

            console.error(
              "[SIGNAL] WebSocket error:",
              error
            );


            setStatus(
              "WebSocket connection error"
            );

          };


        socket.onclose =
          () => {

            console.log(
              "[SIGNAL] WebSocket closed"
            );


            setStatus(
              "Disconnected from signal server"
            );

          };

      } catch (error) {

        console.error(
          "[CALL APP] Connection error:",
          error
        );


        setStatus(
          "Unable to start call"
        );

      }

    }


    function leaveCall() {

      if (socket) {

        try {

          socket.send(

            JSON.stringify({

              type: "leave"

            })

          );

        } catch {}

      }


      if (peerConnection) {

        peerConnection.close();

        peerConnection =
          null;

      }


      remoteVideo.srcObject =
        null;


      remoteClientId =
        null;


      pendingCandidates = [];


      setStatus(
        "Left the call"
      );

    }


    cameraBtn.addEventListener(

      "click",

      async () => {

        if (!localStream) {
          return;
        }


        const track =
          localStream.getVideoTracks()[0];


        if (track) {

          track.enabled =
            !track.enabled;


          cameraBtn.textContent =
            track.enabled
              ? "Camera"
              : "Camera Off";

        }

      }

    );


    micBtn.addEventListener(

      "click",

      async () => {

        if (!localStream) {
          return;
        }


        const track =
          localStream.getAudioTracks()[0];


        if (track) {

          track.enabled =
            !track.enabled;


          micBtn.textContent =
            track.enabled
              ? "Microphone"
              : "Microphone Off";

        }

      }

    );


    joinBtn.addEventListener(

      "click",

      async () => {

        try {

          await connectSocket();

        } catch (error) {

          console.error(
            "[CALL APP]",
            error
          );

        }

      }

    );


    leaveBtn.addEventListener(
      "click",
      leaveCall
    );


    window.addEventListener(

      "beforeunload",

      () => {

        try {

          socket?.close();

        } catch {}

      }

    );

  </script>

</body>
</html>
